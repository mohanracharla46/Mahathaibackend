# Render Infrastructure Blueprint for Maha Thai
# To deploy: Render -> Blueprints -> New Blueprint Instance -> Link your repository.
services:
  # -------------------------------------------------------------
  # Backend: Laravel (Docker Web Service)
  # -------------------------------------------------------------
  - type: web
    name: mahathai-backend
    env: docker
    plan: free
    region: oregon
    branch: main
    # Health check path for auto-recovery
    healthCheckPath: /api/menu-categories
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # IMPORTANT: Set this manually in Render Dashboard -> Environment
      # Run: php artisan key:generate --show  to get a valid key
      - key: APP_KEY
        value: base64:dpCeGTmeBEGgwZqACcqc4IL4ftuK+mngvzKYnPRA8d4=
      - key: APP_URL
        value: https://mahathaibackend.onrender.com
      - key: FRONTEND_URL
        value: https://mahathai-1.onrender.com
      # Database environment variables linked to the PostgreSQL database
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: mahathai-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mahathai-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: mahathai-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: mahathai-db
          property: username
      - key: DB_PASSWORD
        fromDatabase:
          name: mahathai-db
          property: password
      - key: RUN_MIGRATIONS
        value: "true"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: UBER_DIRECT_ENABLED
        value: "true"
      - key: UBER_DIRECT_CUSTOMER_ID
        sync: false
      - key: UBER_DIRECT_CLIENT_ID
        sync: false
      - key: UBER_DIRECT_CLIENT_SECRET
        sync: false
      - key: UBER_DIRECT_WEBHOOK_SECRET
        sync: false
      - key: UBER_DIRECT_PICKUP_PHONE
        sync: false
      - key: UBER_DIRECT_PICKUP_ADDRESS
        sync: false

  # -------------------------------------------------------------
  # Frontend: React (Vite Static Site)
  # -------------------------------------------------------------
  - type: static
    name: mahathai-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      # SPA fallback routing rule to support React Router deep links
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://mahathaibackend.onrender.com

# -------------------------------------------------------------
# Database: Render PostgreSQL
# -------------------------------------------------------------
databases:
  - name: mahathai-db
    plan: free
    region: oregon
    ipAllowList: [] # empty = only allow services in the same account
